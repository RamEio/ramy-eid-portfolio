<!DOCTYPE html>
<html>
<head>
    <title>Experience Sorting Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .experience-item { margin: 10px 0; padding: 10px; background: #f5f5f5; }
        .present { background: #e8f5e8; border-left: 4px solid #4CAF50; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Experience Sorting Debug</h1>
    
    <div class="debug-section">
        <h2>1. JSON Fetch Test</h2>
        <div id="json-test"></div>
    </div>
    
    <div class="debug-section">
        <h2>2. Sorting Logic Test</h2>
        <div id="sorting-test"></div>
    </div>
    
    <div class="debug-section">
        <h2>3. Final Experience Order</h2>
        <div id="final-order"></div>
    </div>
    
    <script>
        // Copy the getEndYear function from the original code
        function getEndYear(period) {
            if (!period) return 0;
            
            if (period.includes(' - ')) {
                const parts = period.split(' - ');
                const endPart = parts[parts.length - 1];
                
                if (endPart.toLowerCase() === 'present' || endPart.toLowerCase() === 'current') {
                    return new Date().getTime();
                }
                
                const monthNames = ['january', 'february', 'march', 'april', 'may', 'june', 
                                   'july', 'august', 'september', 'october', 'november', 'december'];
                
                const endPartLower = endPart.toLowerCase();
                for (let i = 0; i < monthNames.length; i++) {
                    if (endPartLower.includes(monthNames[i])) {
                        const yearMatch = endPart.match(/\d{4}/);
                        if (yearMatch) {
                            const year = parseInt(yearMatch[0]);
                            const month = i;
                            return new Date(year, month, 1).getTime();
                        }
                    }
                }
                
                const yearMatch = endPart.match(/\d{4}/);
                return yearMatch ? new Date(parseInt(yearMatch[0]), 11, 1).getTime() : 0;
            } else if (period.includes('-')) {
                const yearMatch = period.match(/\d{4}/);
                return yearMatch ? new Date(parseInt(yearMatch[0]), 11, 1).getTime() : 0;
            } else {
                const yearMatch = period.match(/\d{4}/);
                return yearMatch ? new Date(parseInt(yearMatch[0]), 11, 1).getTime() : 0;
            }
        }
        
        async function debugExperienceSorting() {
            const jsonTestDiv = document.getElementById('json-test');
            const sortingTestDiv = document.getElementById('sorting-test');
            const finalOrderDiv = document.getElementById('final-order');
            
            // Test 1: JSON Fetch
            jsonTestDiv.innerHTML = '<p>Testing JSON fetch...</p>';
            
            try {
                const response = await fetch('js/experience-data.json', {cache: 'no-cache'});
                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('JSON data loaded:', data);
                
                jsonTestDiv.innerHTML = `
                    <p class="success">✅ JSON loaded successfully!</p>
                    <p>Number of experiences: ${data.experiences.length}</p>
                    <p>First experience: ${data.experiences[0].title} (${data.experiences[0].period})</p>
                    <p>Last experience: ${data.experiences[data.experiences.length - 1].title} (${data.experiences[data.experiences.length - 1].period})</p>
                `;
                
                // Test 2: Sorting Logic
                sortingTestDiv.innerHTML = '<p>Testing sorting logic...</p>';
                
                const experiences = [...data.experiences];
                console.log('Original order:', experiences.map(e => `${e.title} (${e.period})`));
                
                // Apply sorting
                experiences.sort((a, b) => {
                    const endYearA = getEndYear(a.period);
                    const endYearB = getEndYear(b.period);
                    console.log(`Comparing: ${a.title} (${endYearA}) vs ${b.title} (${endYearB})`);
                    return endYearB - endYearA;
                });
                
                console.log('Sorted order:', experiences.map(e => `${e.title} (${e.period})`));
                
                sortingTestDiv.innerHTML = `
                    <p class="success">✅ Sorting applied!</p>
                    <p>Sorting function: getEndYear()</p>
                    <p>Sort direction: Most recent first (endYearB - endYearA)</p>
                `;
                
                // Test 3: Final Order
                finalOrderDiv.innerHTML = '<h3>Final Experience Order:</h3>';
                
                experiences.forEach((exp, index) => {
                    const isPresent = exp.period.toLowerCase().includes('present');
                    const div = document.createElement('div');
                    div.className = `experience-item ${isPresent ? 'present' : ''}`;
                    div.innerHTML = `
                        <strong>${index + 1}. ${exp.title}</strong><br>
                        <em>${exp.company}</em><br>
                        Period: ${exp.period}<br>
                        End Year Timestamp: ${getEndYear(exp.period)}
                    `;
                    finalOrderDiv.appendChild(div);
                });
                
            } catch (error) {
                console.error('Error:', error);
                jsonTestDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
                sortingTestDiv.innerHTML = '<p class="error">❌ Cannot test sorting due to JSON error</p>';
                finalOrderDiv.innerHTML = '<p class="error">❌ Cannot show final order due to JSON error</p>';
            }
        }
        
        // Run the debug
        debugExperienceSorting();
    </script>
</body>
</html>
