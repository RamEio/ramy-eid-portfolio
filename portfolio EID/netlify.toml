[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Form handling configuration
[build.environment]
  NODE_VERSION = "18"

# Form notifications
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';"

# Contact form processing
[forms]
  [forms.contact]
    name = "Contact Form"
    fields = ["name", "email", "subject", "message", "privacy", "marketing"]
    honeypot = "bot-field"
    
    # Email notifications
    [forms.contact.notifications]
      email = "expertise.inno.design@gmail.com"
      subject = "New Contact Form Submission from {{name}}"
      body = """
      New contact form submission received:
      
      Name: {{name}}
      Email: {{email}}
      Subject: {{subject}}
      Message: {{message}}
      Privacy Consent: {{privacy}}
      Marketing Consent: {{marketing}}
      
      Submitted at: {{submitted_at}}
      IP Address: {{ip}}
      User Agent: {{user_agent}}
      """
      
      # Spam protection
      [forms.contact.notifications.spam]
        enabled = true
        threshold = 0.5
        
      # Rate limiting
      [forms.contact.notifications.rate_limit]
        enabled = true
        max_submissions = 3
        window = "1h"
        
      # Data retention
      [forms.contact.notifications.retention]
        enabled = true
        days = 30
