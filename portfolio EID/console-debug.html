<!DOCTYPE html>
<html>
<head>
    <title>Console Debug</title>
</head>
<body>
    <h1>Console Debug - Check Browser Console</h1>
    <p>Open the browser console (F12) and check for any error messages or logs.</p>
    
    <script>
        console.log('=== CONSOLE DEBUG START ===');
        
        // Test 1: Check if experience-page.js loads
        console.log('Testing experience-page.js loading...');
        
        // Test 2: Check JSON fetch
        async function testJSON() {
            try {
                console.log('Fetching JSON...');
                const response = await fetch('js/experience-data.json', {cache: 'no-cache'});
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('JSON loaded successfully');
                console.log('Number of experiences:', data.experiences.length);
                console.log('First experience:', data.experiences[0]);
                console.log('Last experience:', data.experiences[data.experiences.length - 1]);
                
                // Test sorting
                const experiences = [...data.experiences];
                console.log('Original order:', experiences.map(e => `${e.title} (${e.period})`));
                
                // Apply sorting
                experiences.sort((a, b) => {
                    const endYearA = getEndYear(a.period);
                    const endYearB = getEndYear(b.period);
                    return endYearB - endYearA;
                });
                
                console.log('Sorted order:', experiences.map(e => `${e.title} (${e.period})`));
                
            } catch (error) {
                console.error('JSON fetch error:', error);
            }
        }
        
        // Copy getEndYear function
        function getEndYear(period) {
            if (!period) return 0;
            
            if (period.includes(' - ')) {
                const parts = period.split(' - ');
                const endPart = parts[parts.length - 1];
                
                if (endPart.toLowerCase() === 'present' || endPart.toLowerCase() === 'current') {
                    return new Date().getTime();
                }
                
                const monthNames = ['january', 'february', 'march', 'april', 'may', 'june', 
                                   'july', 'august', 'september', 'october', 'november', 'december'];
                
                const endPartLower = endPart.toLowerCase();
                for (let i = 0; i < monthNames.length; i++) {
                    if (endPartLower.includes(monthNames[i])) {
                        const yearMatch = endPart.match(/\d{4}/);
                        if (yearMatch) {
                            const year = parseInt(yearMatch[0]);
                            const month = i;
                            return new Date(year, month, 1).getTime();
                        }
                    }
                }
                
                const yearMatch = endPart.match(/\d{4}/);
                return yearMatch ? new Date(parseInt(yearMatch[0]), 11, 1).getTime() : 0;
            } else if (period.includes('-')) {
                const yearMatch = period.match(/\d{4}/);
                return yearMatch ? new Date(parseInt(yearMatch[0]), 11, 1).getTime() : 0;
            } else {
                const yearMatch = period.match(/\d{4}/);
                return yearMatch ? new Date(parseInt(yearMatch[0]), 11, 1).getTime() : 0;
            }
        }
        
        // Run tests
        testJSON();
        
        console.log('=== CONSOLE DEBUG END ===');
    </script>
</body>
</html>
